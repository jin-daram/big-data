<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1040" height="620" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">inventoryJob 구조</text>
  <text x="40" y="68" font-size="13" fill="#64748b">기준일 2025-12-31 · 실측: READ 40000 / WRITE 40000 / COMMIT 400 · 5분 33초</text>

  <!-- Job -->
  <rect x="40" y="90" width="960" height="330" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="118" font-size="15" font-weight="700" fill="#0f172a">Job: inventoryJob</text>
  <text x="60" y="138" font-size="12" fill="#64748b">InventoryJobConfig.kt · RunIdIncrementer (실행마다 run.id +1)</text>

  <!-- Step -->
  <rect x="60" y="152" width="920" height="250" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="178" font-size="14" font-weight="700" fill="#1d4ed8">Step: inventoryStep</text>
  <text x="80" y="197" font-size="12" fill="#3b82f6">chunk&lt;String, InventoryStatistics&gt;(100) · SKU 100개마다 트랜잭션 1개 커밋</text>

  <!-- Reader -->
  <rect x="85" y="218" width="250" height="150" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text x="105" y="244" font-size="14" font-weight="700" fill="#0f172a">Reader</text>
  <text x="105" y="263" font-size="11" fill="#64748b">InventoryItemReader.kt</text>
  <text x="105" y="288" font-size="12" fill="#334155">JpaPagingItemReader&lt;String&gt;</text>
  <text x="105" y="308" font-size="12" fill="#334155">기준일 하루치에서</text>
  <text x="105" y="326" font-size="12" fill="#334155">group by sku → SKU 목록</text>
  <text x="105" y="350" font-size="12" font-weight="600" fill="#1d4ed8">pageSize 1000 · 40번 조회</text>

  <!-- Processor -->
  <rect x="395" y="218" width="250" height="150" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text x="415" y="244" font-size="14" font-weight="700" fill="#0f172a">Processor</text>
  <text x="415" y="263" font-size="11" fill="#64748b">InventoryItemProcessor.kt</text>
  <text x="415" y="288" font-size="12" fill="#334155">SKU 1개 → 1년치 2920건을</text>
  <text x="415" y="308" font-size="12" fill="#334155">DB에서 avg/min/max/count 집계</text>
  <text x="415" y="326" font-size="12" fill="#334155">→ InventoryStatistics 엔티티</text>
  <text x="415" y="350" font-size="12" font-weight="600" fill="#1d4ed8">결과 없으면 null → 건너뜀</text>

  <!-- Writer -->
  <rect x="705" y="218" width="250" height="150" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text x="725" y="244" font-size="14" font-weight="700" fill="#0f172a">Writer</text>
  <text x="725" y="263" font-size="11" fill="#64748b">InventoryItemWriter.kt</text>
  <text x="725" y="288" font-size="12" fill="#334155">JpaItemWriter</text>
  <text x="725" y="308" font-size="12" fill="#334155">chunk 100개를 한 번에 받아</text>
  <text x="725" y="326" font-size="12" fill="#334155">persist → flush</text>
  <text x="725" y="350" font-size="12" font-weight="600" fill="#1d4ed8">usePersist(true)</text>

  <!-- Step 내부 화살표 -->
  <line x1="335" y1="293" x2="393" y2="293" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="364" y="284" font-size="11" fill="#475569" text-anchor="middle">sku</text>
  <line x1="645" y1="293" x2="703" y2="293" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="674" y="284" font-size="11" fill="#475569" text-anchor="middle">통계 1행</text>

  <!-- DB -->
  <g>
    <rect x="85" y="470" width="410" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="105" y="497" font-size="14" font-weight="700" fill="#15803d">warehouse_inventory</text>
    <text x="105" y="518" font-size="12" fill="#334155">원본 재고 · 1억 1680만 건 · SKU 4만 개</text>
    <text x="105" y="538" font-size="12" fill="#334155">idx_warehouse_inventory_base_date → Reader</text>
    <text x="105" y="558" font-size="12" fill="#334155">idx_inv_sku_base_date (sku, base_date) → Processor</text>
  </g>
  <g>
    <rect x="545" y="470" width="410" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="565" y="497" font-size="14" font-weight="700" fill="#15803d">year_warehouse_inventory_statistics</text>
    <text x="565" y="518" font-size="12" fill="#334155">SKU별 연간 통계 · 40000행</text>
    <text x="565" y="538" font-size="12" fill="#334155">UNIQUE (sku, base_date)</text>
    <text x="565" y="558" font-size="12" fill="#334155">같은 기준일로 재실행하면 중복 에러</text>
  </g>

  <!-- DB 화살표 -->
  <line x1="210" y1="468" x2="210" y2="372" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="218" y="448" font-size="11" fill="#15803d">SKU 조회</text>
  <line x1="420" y1="468" x2="490" y2="372" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="462" y="448" font-size="11" fill="#15803d">SKU별 집계 쿼리</text>
  <line x1="830" y1="372" x2="830" y2="466" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="838" y="448" font-size="11" fill="#15803d">insert</text>

  <!-- JobRepository -->
  <rect x="770" y="100" width="215" height="44" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="785" y="120" font-size="12" font-weight="700" fill="#a16207">JobRepository · BATCH_* 테이블</text>
  <text x="785" y="136" font-size="11" fill="#a16207">실행 상태·건수 기록 (chunk마다 갱신)</text>
</svg>
